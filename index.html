<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#203d33">

    <meta
        name="description"
        content="Learn Polish vocabulary and grammar at levels A1–B2."
    >

    <title>Polish Learning</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <link
        rel="apple-touch-icon"
        href="icons/apple-touch-icon.png"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Learn Polish"
    >
</head>

<body>
    <h1>Learn Polish</h1>

    <noscript>
        This app needs JavaScript to load vocabulary and exercises.
    </noscript>

    <!-- MAIN MENU -->
    <section id="menu-screen" aria-label="Main menu">
        <label for="level-select">Choose your level</label>

        <select id="level-select">
            <option value="A1">A1</option>
            <option value="A2">A2</option>
            <option value="B1">B1</option>
            <option value="B2">B2</option>
        </select>

        <p id="word-count" role="status">
            Loading vocabulary...
        </p>

        <button id="learn-button" type="button" disabled>
            Learn Vocabulary
        </button>

        <button id="listening-button" type="button">
            Listening
        </button>

        <button id="quiz-button" type="button" disabled>
            Vocabulary Quiz
        </button>

        <button id="verb-tenses-button" type="button">
            Verb Tenses
        </button>

        <button id="cases-button" type="button">
            Noun and Adjective Cases
        </button>

        <button id="mixed-grammar-button" type="button">
            Mixed Grammar
        </button>

        <button id="tutorial-button" type="button">
            Grammar Tutorial
        </button>

        <!-- ACCOUNT -->
        <hr>

        <h2>Shared vocabulary</h2>

        <p id="auth-status" role="status">
            Connecting...
        </p>

        <form id="login-form">
            <label for="login-email">Email</label>

            <input
                id="login-email"
                type="email"
                autocomplete="username"
                autocapitalize="none"
                spellcheck="false"
                required
            >

            <label for="login-password">Password</label>

            <input
                id="login-password"
                type="password"
                autocomplete="current-password"
                required
            >

            <button id="login-button" type="submit" disabled>
                Sign in
            </button>
        </form>

        <button id="logout-button" type="button" hidden>
            Sign out
        </button>

        <p id="editor-status" role="status"></p>

        <!-- ADD SHARED VOCABULARY -->
        <details id="shared-word-panel" hidden>
            <summary>Add vocabulary</summary>

            <form id="shared-word-form">
                <label for="shared-polish">
                    Polish word or phrase
                </label>

                <input
                    id="shared-polish"
                    type="text"
                    lang="pl"
                    maxlength="150"
                    required
                >

                <label for="shared-english">
                    English translation
                </label>

                <input
                    id="shared-english"
                    type="text"
                    lang="en"
                    maxlength="200"
                    required
                >

                <label for="shared-synonyms">
                    Polish synonyms — separate with semicolons
                </label>

                <input
                    id="shared-synonyms"
                    type="text"
                    lang="pl"
                    placeholder="synonym one; synonym two"
                    maxlength="1500"
                >

                <label for="shared-level">Level</label>

                <select id="shared-level">
                    <option value="A1">A1</option>
                    <option value="A2">A2</option>
                    <option value="B1">B1</option>
                    <option value="B2">B2</option>
                </select>

                <button id="shared-save-button" type="submit">
                    Add to shared vocabulary
                </button>
            </form>
        </details>

        <p id="shared-word-status" role="status"></p>
        <details id="admin-vocabulary-panel" hidden>
    <summary>Manage shared vocabulary</summary>

    <label for="admin-word-search">Search words</label>
    <input id="admin-word-search" type="search">

    <button id="admin-word-refresh" type="button">
        Refresh list
    </button>

    <p id="admin-word-status" role="status"></p>

    <form id="admin-word-form" hidden>
        <h3>Edit word</h3>

        <label for="admin-word-polish">Polish</label>
        <input
            id="admin-word-polish"
            type="text"
            maxlength="150"
            required
        >

        <label for="admin-word-english">English</label>
        <input
            id="admin-word-english"
            type="text"
            maxlength="200"
            required
        >

        <label for="admin-word-synonyms">
            Polish synonyms — separate with semicolons
        </label>
        <input
            id="admin-word-synonyms"
            type="text"
            maxlength="1500"
        >

        <label for="admin-word-level">Level</label>
        <select id="admin-word-level">
            <option value="A1">A1</option>
            <option value="A2">A2</option>
            <option value="B1">B1</option>
            <option value="B2">B2</option>
        </select>

        <button id="admin-word-save" type="submit">
            Save changes
        </button>

        <button id="admin-word-cancel" type="button">
            Cancel editing
        </button>
    </form>

    <div id="admin-word-list"></div>
    </details>
        <p id="statistics-display"></p>
    </section>

    <!-- VOCABULARY LEARNING -->
    <section
        id="learn-screen"
        aria-label="Learn vocabulary"
        hidden
    >
        <p>Polish word</p>

        <h2 id="polish-word" lang="pl"></h2>

        <button id="pronounce-button" type="button">
            🔊 Listen
        </button>

        <p>English translation</p>

        <h2 id="english-word"></h2>

        <button id="next-button" type="button">
            Next word
        </button>

        <button id="learn-back-button" type="button">
            Back to menu
        </button>
    </section>

    <!-- VOCABULARY QUIZ -->
    <section
        id="quiz-screen"
        aria-labelledby="quiz-title"
        hidden
    >
        <h2 id="quiz-title">Vocabulary Quiz</h2>

        <p>Translate into Polish.</p>

        <p id="quiz-counter"></p>
        <p id="quiz-score"></p>

        <h2 id="quiz-word"></h2>

        <form id="quiz-form">
            <label for="answer-input">Your answer</label>

            <input
                id="answer-input"
                type="text"
                lang="pl"
                autocomplete="off"
                autocapitalize="none"
                spellcheck="false"
                enterkeyhint="done"
                required
            >

            <button id="check-button" type="submit">
                Check
            </button>
        </form>

        <p id="quiz-feedback" role="status"></p>

        <button
            id="accept-answer-button"
            type="button"
            hidden
        >
            My answer is correct
        </button>

        <button
            id="quiz-next-button"
            type="button"
            disabled
        >
            Next word
        </button>

        <button id="review-button" type="button" hidden>
            Review mistakes
        </button>

        <button id="quiz-back-button" type="button">
            Back to menu
        </button>
    </section>

    <!-- GRAMMAR EXERCISES -->
    <section
        id="grammar-screen"
        aria-labelledby="grammar-title"
        hidden
    >
        <h2 id="grammar-title"></h2>

        <p id="grammar-counter"></p>
        <p id="grammar-score"></p>

        <h3 id="grammar-prompt"></h3>

        <form id="grammar-form">
            <label for="grammar-answer">
                Complete the missing form
            </label>

            <input
                id="grammar-answer"
                type="text"
                lang="pl"
                autocomplete="off"
                autocapitalize="none"
                spellcheck="false"
                enterkeyhint="done"
                required
            >

            <button id="grammar-check-button" type="submit">
                Check
            </button>
        </form>

        <p id="grammar-feedback" role="status"></p>
        <p id="grammar-explanation"></p>

        <button
            id="grammar-next-button"
            type="button"
            disabled
        >
            Next exercise
        </button>

        <button id="grammar-back-button" type="button">
            Back to menu
        </button>
    </section>

    <!-- GRAMMAR TUTORIAL -->
    <section
        id="tutorial-screen"
        aria-labelledby="tutorial-title"
        hidden
    >
        <h2 id="tutorial-title">Grammar Tutorial</h2>

        <label for="tutorial-select">Choose a topic</label>

        <select id="tutorial-select" disabled></select>

        <p id="tutorial-status" role="status"></p>

        <div id="tutorial-content"></div>

        <button id="tutorial-back-button" type="button">
            Back to menu
        </button>
    </section>

    <!-- LISTENING -->
    <section
        id="listening-screen"
        aria-labelledby="listening-title"
        hidden
    >
        <h2 id="listening-title">Listening</h2>

        <p>Listen and write the sentence in Polish.</p>

        <p id="listening-counter"></p>
        <p id="listening-score"></p>
        <p id="listening-status" role="status"></p>

        <button
            id="listening-play-button"
            type="button"
            disabled
        >
            🔊 Listen
        </button>

        <button
            id="listening-slow-button"
            type="button"
            disabled
        >
            🔊 Listen slowly
        </button>

        <form id="listening-form" hidden>
            <label for="listening-answer">
                What did you hear?
            </label>

            <input
                id="listening-answer"
                type="text"
                lang="pl"
                autocomplete="off"
                autocapitalize="none"
                spellcheck="false"
                enterkeyhint="done"
                required
            >

            <button id="listening-check-button" type="submit">
                Check
            </button>
        </form>

        <p id="listening-feedback" role="status"></p>
        <p id="listening-correct" lang="pl"></p>
        <p id="listening-translation" lang="en"></p>

        <button
            id="listening-next-button"
            type="button"
            disabled
        >
            Next sentence
        </button>

        <button
            id="listening-review-button"
            type="button"
            hidden
        >
            Review mistakes
        </button>

        <button id="listening-back-button" type="button">
            Back to menu
        </button>
    </section>

    <!-- Keep this script order. -->
    <script src="app.js"></script>
    <script src="supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script src="shared-vocabulary.js"></script>
    <script src="admin-vocabulary.js"></script>
</body>
</html>
